name: Test plugin with Matomo

on:
  pull_request: {}
  workflow_dispatch: {}
  push:
    branches: ["5.x-dev", "6.x-dev"]
jobs:
  PluginTests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.2', '8.3', '8.4' ]
        target: ['minimum_required_matomo', 'maximum_supported_matomo']
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
          persist-credentials: false
      - name: Start Keycloak
        run: |
          docker run -d --name keycloak -p 8080:8080 \
            -v "$PWD/tests/keycloak:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8 start-dev --import-realm
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/realms/matomo/.well-known/openid-configuration > /dev/null && exit 0
            sleep 3
          done
          docker logs keycloak
          exit 1
      - name: Run tests
        env:
          KEYCLOAK_URL: http://localhost:8080
        uses: Digitalist-Open-Cloud/Matomo-github-action-tests@main
        with:
          plugin-name: 'RebelOIDC'
          php-version: ${{ matrix.php }}
          test-type: 'PluginTests'
          matomo-test-branch: ${{ matrix.target }}
